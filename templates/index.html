<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handwritten Digit Predictor</title>
    <link rel="stylesheet" href="../static/styles.css">
</head>
<body>

    <div class="container">

        <form class="card" action="/" method="POST" enctype="multipart/form-data">
            
            <h1 class="title"> Digit Predictor</h1>
            <h2 class = "title"> Only works with 0 -9 numbers in black background and white color </h2>

            <div class="upload-section">
                <label for="image" class="upload-label">Upload your digit image</label>
                <input type="file" id="image" name="image" class="file-input">
            </div>

            <button type="submit" class="btn">Predict</button>

        </form>

        <div class="result">
            {% if pred_vlaue != 0 %}
            <p>Predicted Number: <span>{{pred_value}}</span></p>
            {% endif %}
        </div>

    </div>

</body>
</html>
